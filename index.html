<title>life-advice</title>

<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f0ebe0;
    --red: #c4262b;
  }
  * { box-sizing: border-box; }
  html { height: 100%; background: var(--bg); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--red);
    font-family: "Manrope", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  .wrap {
    width: 100%; max-width: 480px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: 12px 10px 14px;
  }
  .text { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .label {
    font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
    opacity: .75; margin-bottom: 6px;
    text-align: justify; text-align-last: justify;
  }
  .answer {
    font-size: 12px; line-height: 1.32; font-weight: 500;
    text-align: justify; text-align-last: justify;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .answer.short, .label.short { text-align: left; text-align-last: left; }
  .name {
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-align: right; margin-top: 8px;
  }
  .stage { position: relative; flex: 1; min-height: 420px; margin-top: 18px; }
  .stage img {
    position: absolute; display: block; max-width: none;
    opacity: 0; transition: opacity .9s ease;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  .stage img.in { opacity: 1; }
</style>
</head>

  // Build pool of every non-empty (row, question) pair
  const pool = [];
  RESPONSES.forEach((r, ri) => r.answers.forEach((a, qi) => {
    if (a && a.trim()) pool.push({ ri, qi });
  }));

  // Shuffled order: every response appears once (in random order) before any repeats.
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pick() {
    const ids = pool.map(p => `${p.ri}-${p.qi}`);
    let queue = [];
    try {
      queue = JSON.parse(localStorage.getItem("queue") || "[]").filter(id => ids.includes(id));
    } catch (e) {}
    if (!queue.length) {
      let last = null;
      try { last = localStorage.getItem("last"); } catch (e) {}
      queue = shuffle(ids.slice());
      if (queue.length > 1 && queue[0] === last) queue.push(queue.shift());
    }
    const id = queue.shift();
    try {
      localStorage.setItem("queue", JSON.stringify(queue));
      localStorage.setItem("last", id);
    } catch (e) {}
    const [ri, qi] = id.split("-").map(Number);
    return { ri, qi };
  }

  function show() {
    const answerEl = document.getElementById("answer");
    if (!pool.length) { answerEl.textContent = "No responses yet."; return; }
    const c = pick();
    const text = RESPONSES[c.ri].answers[c.qi].trim();
    document.getElementById("label").textContent = QUESTIONS[c.qi];
    answerEl.textContent = text;
    document.getElementById("name").textContent = RESPONSES[c.ri].name.trim();
    // very short answers would look silly stretched edge to edge
    answerEl.classList.toggle("short", text.split(/\s+/).length < 8);
    document.getElementById("label").classList.toggle("short", QUESTIONS[c.qi].split(/\s+/).length < 6);
  }

  // ---------- Images, scattered below the text ----------
  const rand = (a, b) => a + Math.random() * (b - a);

  function layout() {
    const stage = document.getElementById("stage");
    const W = stage.clientWidth, H = stage.clientHeight;
    const count = Math.random() < 0.5 ? 4 : 5;
    const picks = shuffle(IMAGES.slice()).slice(0, count);
    const base = Math.min(Math.max(W * 0.24, 70), 150);
    const placed = [];
    const gap = 8;

    picks.forEach(item => {
      let scale = 1, spot = null;
      for (let round = 0; round < 6 && !spot; round++) {
        const size = base * rand(0.75, 1.45) * scale;
        const k = size / Math.max(item.w, item.h);
        const w = item.w * k, h = item.h * k;
        if (w > W || h > H) { scale *= 0.85; continue; }
        for (let i = 0; i < 120; i++) {
          const x = rand(0, W - w), y = rand(0, H - h);
          const r = { l: x - gap, t: y - gap, r: x + w + gap, b: y + h + gap };
          if (!placed.some(p => r.l < p.r && r.r > p.l && r.t < p.b && r.b > p.t)) {
            spot = { x, y, w, h };
            break;
          }
        }
        scale *= 0.85;
      }
      if (!spot) return;
      placed.push({ l: spot.x, t: spot.y, r: spot.x + spot.w, b: spot.y + spot.h });
      const img = new Image();
      img.alt = ""; img.draggable = false;
      img.style.width = spot.w + "px"; img.style.height = spot.h + "px";
      img.style.left = spot.x + "px"; img.style.top = spot.y + "px";
      img.onload = () => requestAnimationFrame(() => img.classList.add("in"));
      img.src = item.d;
      stage.appendChild(img);
    });
  }

  show();
  requestAnimationFrame(() => requestAnimationFrame(layout));
</script>
